schema_version: "1.1"
name: smoke-solution-wedge
description: A request that never names the skill should route to product-idea-agent:solution-wedge.
tags: [smoke]
execution:
  prompt: >-
    Help me decide what the first version of my thermal home-audit app should include, what to leave out, and how it should stand apart from the thermal camera apps that already exist.
  max_turns: 4
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:product-idea-agent:)?solution-wedge"'
