schema_version: "1.1"
name: smoke-pricing-wtp
description: A request that never names the skill should route to product-idea-agent:pricing-wtp.
tags: [smoke]
execution:
  prompt: >-
    What should I charge for a home energy audit app, and would homeowners pay for a premium tier on top of a free scan?
  max_turns: 4
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:product-idea-agent:)?pricing-wtp"'
