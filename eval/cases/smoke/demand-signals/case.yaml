schema_version: "1.1"
name: smoke-demand-signals
description: A request that never names the skill should route to product-idea-agent:demand-signals.
tags: [smoke]
execution:
  prompt: >-
    Before I build anything, is anyone actually looking for DIY home energy audit tools? I want to know what people search for and what they complain about on Reddit and forums.
  max_turns: 4
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:product-idea-agent:)?demand-signals"'
