schema_version: "1.1"
name: smoke-scorecard-generator
description: A request that never names the skill should route to product-idea-agent:scorecard-generator.
tags: [smoke]
execution:
  prompt: >-
    My research on the home energy audit app idea is done. Score the opportunity across the standard dimensions and give me a go, pivot or no-go call.
  max_turns: 4
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:product-idea-agent:)?scorecard-generator"'
