schema_version: "1.1"
name: smoke-idea-validation-orchestrator
description: A request that never names the skill should route to product-idea-agent:idea-validation-orchestrator.
tags: [smoke]
execution:
  prompt: >-
    Validate my startup idea end to end, from demand and customers through pricing and go-to-market to a final recommendation: a phone app that turns the thermal sensor in newer iPhones into a DIY home energy audit tool.
  max_turns: 4
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:product-idea-agent:)?idea-validation-orchestrator"'
