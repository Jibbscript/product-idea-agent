schema_version: "1.1"
name: smoke-problem-segment
description: A request that never names the skill should route to product-idea-agent:problem-segment.
tags: [smoke]
execution:
  prompt: >-
    Who feels the pain of drafty, expensive-to-heat older homes most acutely, and how badly? I need a clear picture of the ideal customer for a DIY thermal-scan home audit app.
  max_turns: 4
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:product-idea-agent:)?problem-segment"'
