schema_version: "1.1"
name: smoke-validation-report
description: A request that never names the skill should route to product-idea-agent:validation-report.
tags: [smoke]
execution:
  prompt: >-
    Write up the complete validation findings for my home energy audit app idea as one report I can hand to my co-founder and to investors.
  max_turns: 2
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:product-idea-agent:)?validation-report"'
