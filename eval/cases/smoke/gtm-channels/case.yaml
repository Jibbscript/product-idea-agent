schema_version: "1.1"
name: smoke-gtm-channels
description: A request that never names the skill should route to product-idea-agent:gtm-channels.
tags: [smoke]
execution:
  prompt: >-
    How do I get the first thousand users for a DIY home energy audit app? Which acquisition channels are worth trying first, and in what order?
  max_turns: 4
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:product-idea-agent:)?gtm-channels"'
