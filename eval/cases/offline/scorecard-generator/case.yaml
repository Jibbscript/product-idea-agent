schema_version: "1.1"
name: offline-scorecard-generator
description: Scores the t1 fixture's nine upstream artifacts with no web access; run with --scaffold and --allow-tools Write WebSearch WebFetch.
tags: [offline]
context:
  scaffold_script: seed.sh
execution:
  prompt: >-
    The research for my home energy audit app idea is finished, and every artifact from it is in the current directory. Score the opportunity and save the scorecard as scorecard.json in the current directory.
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill, Write, WebSearch, WebFetch]
graders:
  - name: scorecard-written
    type: file_exists
    path: scorecard.json
  - name: scorecard-contract-shape
    type: regex
    target: { source: file, path: scorecard.json }
    pattern: '^(?=[\s\S]*\"problem_severity\")(?=[\s\S]*\"demand_signals\")(?=[\s\S]*\"competitive_intensity\")(?=[\s\S]*\"market_size\")(?=[\s\S]*\"execution_difficulty\")(?=[\s\S]*\"gtm_viability\")(?=[\s\S]*\"timing\")(?=[\s\S]*\"composite_score\"\s*:\s*\d)(?=[\s\S]*\"verdict\"\s*:\s*\"(GO|PIVOT|NO-GO)\")'
  - name: no-websearch
    type: tool_used
    tool: WebSearch
    min: 0
    max: 0
  - name: no-webfetch
    type: tool_used
    tool: WebFetch
    min: 0
    max: 0
  - name: scorecard-generator-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:product-idea-agent:)?scorecard-generator"'
