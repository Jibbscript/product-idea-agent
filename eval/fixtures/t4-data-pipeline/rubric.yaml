# Evaluation Rubric: T4 Data Pipeline Monitoring

dimensions:
  correctness:
    weight: 0.25
    criteria:
      - name: "Factual accuracy"
        points: 5
        description: "Data observability landscape accurately described"
      - name: "Market size plausibility"
        points: 5
        description: "Data tooling market sizing reasonable"
      - name: "Competitor accuracy"
        points: 5
        description: "Monte Carlo, Atlan, etc. correctly positioned"
      - name: "Technical feasibility"
        points: 5
        description: "Integration claims are realistic"
      - name: "Pricing realism"
        points: 5
        description: "Usage pricing benchmarks accurate"

  usefulness:
    weight: 0.25
    criteria:
      - name: "Actionable insights"
        points: 5
      - name: "Decision support"
        points: 5
      - name: "Completeness"
        points: 5
      - name: "Prioritization"
        points: 5
      - name: "Risk identification"
        points: 5

  citation_quality:
    weight: 0.20
    criteria:
      - name: "Source presence"
        points: 5
      - name: "Source credibility"
        points: 5
      - name: "Source recency"
        points: 5
      - name: "Quote accuracy"
        points: 5

  reproducibility:
    weight: 0.15
    criteria:
      - name: "Methodology clarity"
        points: 5
      - name: "Consistent scoring"
        points: 5
      - name: "Artifact compliance"
        points: 5

  time_to_answer:
    weight: 0.15
    criteria:
      - name: "Completion time"
        points: 5
      - name: "Efficiency"
        points: 5

expectations:
  composite_score_range: [60, 75]
  recommendation: "GO or PIVOT"
  key_signals:
    - "Strong demand in data engineering community"
    - "Gap between enterprise ($$$) and open source"
    - "Modern data stack adoption growing"
  key_risks:
    - "Competitive: Well-funded data observability players"
    - "Technical: Supporting many integration points"
    - "GTM: Reaching data teams effectively"
