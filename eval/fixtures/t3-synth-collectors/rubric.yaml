# Evaluation Rubric: T3 Synth Collectors

dimensions:
  correctness:
    weight: 0.25
    criteria:
      - name: "Factual accuracy"
        points: 5
        description: "Vintage synth market accurately represented"
      - name: "Market size plausibility"
        points: 5
        description: "Niche market sizing is realistic"
      - name: "Competitor accuracy"
        points: 5
        description: "eBay, Reverb positioning correct"
      - name: "Technical feasibility"
        points: 5
      - name: "Pricing realism"
        points: 5

  usefulness:
    weight: 0.25
    criteria:
      - name: "Actionable insights"
        points: 5
      - name: "Decision support"
        points: 5
      - name: "Completeness"
        points: 5
      - name: "Prioritization"
        points: 5
      - name: "Risk identification"
        points: 5

  citation_quality:
    weight: 0.20
    criteria:
      - name: "Source presence"
        points: 5
      - name: "Source credibility"
        points: 5
      - name: "Source recency"
        points: 5
      - name: "Quote accuracy"
        points: 5

  reproducibility:
    weight: 0.15
    criteria:
      - name: "Methodology clarity"
        points: 5
      - name: "Consistent scoring"
        points: 5
      - name: "Artifact compliance"
        points: 5

  time_to_answer:
    weight: 0.15
    criteria:
      - name: "Completion time"
        points: 5
      - name: "Efficiency"
        points: 5

expectations:
  composite_score_range: [50, 65]
  recommendation: "PIVOT"
  key_signals:
    - "Passionate niche community"
    - "High trust barrier (authentication value)"
    - "Limited competition in niche"
  key_risks:
    - "Market: Very small TAM (<$100M)"
    - "Execution: Authentication expertise required"
    - "GTM: Reaching fragmented collector community"
  notes:
    - "This is intentionally a smaller market to test niche sizing"
    - "Good test of appropriate recommendation for limited opportunity"
