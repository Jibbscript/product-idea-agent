pricing:
  version: "1.0"

  competitor_benchmarks:
    - competitor: "FLIR ONE Gen 3 / FLIR ONE Pro (clip-on thermal camera)"
      model: "onetime"
      low: 150
      high: 400
      notes: "One-time clip-on hardware purchase (FLIR ONE Gen 3 $199.99 list / $149.99 on sale; FLIR ONE Pro $399.99); FLIR ONE Gen 3 is the entry camera our app supports (the Pro is not on the supported list), so a high upfront cost barrier for users who do not already own or borrow one"

    - competitor: "HomeBoost BoostBox"
      model: "onetime"
      low: 99
      high: 99
      notes: "$99 DIY home energy assessment kit launched Oct 2024 (iPhone plug-in thermal camera, blacklight, ~30-minute guided app scan with upgrade and rebate report); cheaper all-in than buying a FLIR ONE"

    - competitor: "Professional Energy Auditors"
      model: "onetime"
      low: 300
      high: 500
      notes: "One-time service fee; expensive for repeat assessments"

    - competitor: "Sense Home Monitor"
      model: "onetime"
      low: 299
      high: 349
      notes: "Hardware + free app; no recurring revenue model"

    - competitor: "Energy Auditing Apps (competitors)"
      model: "freemium"
      low: 0
      high: 10
      notes: "Basic apps with premium features; low conversion rates"

  value_ladder:
    - tier: "Free"
      offering: "No-camera guided draft check (visual checklist plus incense / smoke-pencil walkthrough), plus 3 thermal room scans per month with a supported camera, generic tips"
      price: 0
      purpose: "acquisition"

    - tier: "Home Plan"
      offering: "Unlimited scans, full home audit workflow, savings calculator, priority support"
      price: 30
      billing: "annual"
      purpose: "conversion"

    - tier: "Pro Plan"
      offering: "Everything in Home + contractor matching, detailed reports for rebate applications, multi-property support"
      price: 60
      billing: "annual"
      purpose: "expansion"

  unit_economics:
    target_arpc: 4.50  # $30/year ÷ 12 months + referral revenue
    estimated_cac: 15  # App store + content marketing; excludes the clip-on camera cost the user bears
    ltv_cac_ratio: 4.8  # Based on 24-month retention
    payback_months: 3.5
    gross_margin: 0.85  # Software margins

  wtp_evidence:
    - source: "Reddit r/homeimprovement thread"
      insight: "Users express willingness to pay $30-50 for one-time audit alternative"
    - source: "App store reviews of competitor apps"
      insight: "Complaints about $5-10/month subscriptions suggest annual pricing preference"
    - source: "Contractor referral value"
      insight: "Home improvement contractors pay 5-15% for qualified leads; energy efficiency projects average $2,000-5,000"

  recommendation:
    model: "freemium"
    entry_price: 30
    rationale: "Annual subscription at $30 positions below professional audit cost
      ($300-500) and HomeBoost's $99 kit while capturing recurring revenue. Users
      bring their own clip-on camera (FLIR ONE Gen 3 $149.99-$199.99, owned or
      borrowed from a library lending program), so the price covers the software
      layer only; for homeowners with no camera access, HomeBoost's kit is the
      cheaper path. Contractor referrals provide additional revenue per engaged user."
