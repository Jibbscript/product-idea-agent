name: plugin-eval

# Runs the plugin's `claude plugin eval` suite (eval/cases/) on demand. Every
# run is a paid model call on the ANTHROPIC_API_KEY secret, so this is never a
# PR gate. Models are pinned so scores stay comparable across runs.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Case tag to run"
        required: true
        default: smoke
        type: choice
        options: [smoke, offline, research, full]
      model:
        description: "Agent model"
        required: true
        default: claude-fable-5-1
        type: choice
        options: [claude-fable-5-1, claude-opus-5-5]
      max_cost_usd:
        description: "Cost ceiling in USD (list-price estimate)"
        required: true
        default: "10"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.284

      # smoke measures routing, which has no baseline meaning; the other tags
      # compare against the no-plugin arm. --scaffold runs the seed.sh scripts
      # under eval/cases/, which this repository authors.
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISABLE_AUTOUPDATER: "1"
          TAG: ${{ inputs.tag }}
          MODEL: ${{ inputs.model }}
          MAX_COST_USD: ${{ inputs.max_cost_usd }}
        run: |
          ablation=with-without
          if [ "$TAG" = smoke ]; then ablation=none; fi
          claude plugin eval . --tag "$TAG" \
            --ablation "$ablation" --scaffold \
            --allow-tools Write Edit WebSearch WebFetch \
            --trust-plugin --no-publish -j 4 \
            --model "$MODEL" --judge-model claude-haiku-4-5-20251001 \
            --max-cost-usd "$MAX_COST_USD" \
            --json eval-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-eval-${{ inputs.tag }}-${{ inputs.model }}
          path: |
            eval-results.json
            eval/cases/results/
